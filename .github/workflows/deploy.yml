name: Production CI/CD Pipeline

on:
  push:
    branches:
      - main
      - feat/dashboard-fixes

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      # Step 1: Checkout Repository
      - name: Checkout Code
        uses: actions/checkout@v4

      # Step 2: Login to Docker Hub
      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Step 3: Setup Docker Build Environment
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      # Step 4: Build and Push Backend API Container
      - name: Build & Push API Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile.api
          push: true
          tags: ${{ vars.DOCKERHUB_USERNAME }}/chaiform-api:latest

      # Step 5: Build and Push Frontend Web Container
      - name: Build & Push Web Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile.web
          push: true
          build-args: |
            NEXT_PUBLIC_API_URL=https://api.kenilpatel.in/trpc
          tags: ${{ vars.DOCKERHUB_USERNAME }}/chaiform-web:latest

      # Step 6: Deploy on Oracle Cloud Server via Native OpenSSH
      - name: Deploy to Production Server
        env:
          SSH_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SERVER_IP: ${{ vars.SERVER_IP }}
        run: |
          mkdir -p ~/.ssh

          # Support both Base64-encoded key (bulletproof) and raw PEM key
          if echo "$SSH_KEY" | grep -q "^LS0t"; then
            echo "$SSH_KEY" | base64 -d > ~/.ssh/id_rsa
          else
            printf '%s\n' "$SSH_KEY" | tr -d '\r' > ~/.ssh/id_rsa
          fi

          # Ensure strict permissions and proper ending
          sed -i -e '$a\' ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa

          echo "Connecting to Oracle Cloud VM and deploying containers..."
          ssh -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -i ~/.ssh/id_rsa ubuntu@"$SERVER_IP" << 'EOF'
            set -e
            echo "Successfully connected to Oracle Cloud Server!"

            # 1. Clone repository if not present, otherwise pull latest configs
            if [ ! -d "/home/ubuntu/ChaiForm" ]; then
              git clone https://github.com/patelkenil26/ChaiForm.git /home/ubuntu/ChaiForm
            fi
            cd /home/ubuntu/ChaiForm
            git pull || true

            # 2. Pull the latest images pushed to Docker Hub
            docker compose -f docker-compose.prod.yml pull

            # 3. Start or update containers in background (Zero Downtime)
            docker compose -f docker-compose.prod.yml up -d --remove-orphans

            # 4. Clean old unused docker image layers to save disk space
            docker image prune -f

            echo "Containers deployed successfully! Listing running containers:"
            docker compose -f docker-compose.prod.yml ps
          EOF

