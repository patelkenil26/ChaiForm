name: Production CI/CD Pipeline

on:
  push:
    branches:
      - main
      - feat/dashboard-fixes
  workflow_dispatch:
    inputs:
      force_all:
        description: "Force rebuild and deploy all containers regardless of changes"
        required: false
        type: boolean
        default: false

jobs:
  validate:
    name: Quality Gate (Lint, Types & Build)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup pnpm 9
        uses: pnpm/action-setup@v4
        with:
          version: 9.0.0
          run_install: false

      - name: Get pnpm store directory
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

      - name: Setup pnpm cache
        uses: actions/cache@v4
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify Monorepo Types
        run: pnpm run check-types

      - name: Verify Monorepo Build
        run: pnpm run build
        env:
          NEXT_PUBLIC_API_URL: https://api.kenilpatel.in/trpc
          SKIP_ENV_VALIDATION: "1"

  build-and-deploy:
    name: Build & Deploy
    needs: [validate]
    runs-on: ubuntu-latest

    steps:
      # Step 1: Checkout Repository
      - name: Checkout Code
        uses: actions/checkout@v4

      # Step 2: Detect changed paths across Monorepo
      - name: Detect Changes
        uses: dorny/paths-filter@v3
        id: changes
        with:
          filters: |
            api:
              - 'apps/api/**'
              - 'packages/**'
              - 'package.json'
              - 'pnpm-lock.yaml'
              - 'Dockerfile.api'
              - '.github/workflows/deploy.yml'
            web:
              - 'apps/web/**'
              - 'packages/**'
              - 'package.json'
              - 'pnpm-lock.yaml'
              - 'Dockerfile.web'
              - '.github/workflows/deploy.yml'

      # Step 3: Login to Docker Hub
      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Step 4: Setup Docker Build Environment
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      # Step 5: Build and Push Backend API Container (Selective Build + GHA Layer Cache)
      - name: Build & Push API Image
        if: ${{ inputs.force_all == true || steps.changes.outputs.api == 'true' }}
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile.api
          push: true
          tags: ${{ vars.DOCKERHUB_USERNAME }}/chaiform-api:latest
          cache-from: type=gha,scope=chaiform-api
          cache-to: type=gha,mode=max,scope=chaiform-api

      # Step 6: Build and Push Frontend Web Container (Selective Build + GHA Layer Cache)
      - name: Build & Push Web Image
        if: ${{ inputs.force_all == true || steps.changes.outputs.web == 'true' }}
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile.web
          push: true
          build-args: |
            NEXT_PUBLIC_API_URL=https://api.kenilpatel.in/trpc
          tags: ${{ vars.DOCKERHUB_USERNAME }}/chaiform-web:latest
          cache-from: type=gha,scope=chaiform-web
          cache-to: type=gha,mode=max,scope=chaiform-web

      # Step 7: Deploy on Oracle Cloud Server via Native OpenSSH
      - name: Deploy to Production Server
        env:
          SSH_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SERVER_IP: ${{ vars.SERVER_IP }}
        run: |
          mkdir -p ~/.ssh

          # Support both Base64-encoded key (bulletproof) and raw PEM key
          if echo "$SSH_KEY" | grep -q "^LS0t"; then
            echo "$SSH_KEY" | base64 -d > ~/.ssh/id_rsa
          else
            printf '%s\n' "$SSH_KEY" | tr -d '\r' > ~/.ssh/id_rsa
          fi

          # Ensure strict permissions and proper ending
          sed -i -e '$a\' ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa

          echo "Connecting to Oracle Cloud VM and deploying containers..."
          ssh -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -i ~/.ssh/id_rsa ubuntu@"$SERVER_IP" << 'EOF'
            set -e
            echo "Successfully connected to Oracle Cloud Server!"

            # 1. Clone repository if not present, otherwise pull latest configs
            if [ ! -d "/home/ubuntu/ChaiForm" ]; then
              git clone https://github.com/patelkenil26/ChaiForm.git /home/ubuntu/ChaiForm
            fi
            cd /home/ubuntu/ChaiForm
            git pull || true

            # 2. Pull the latest images pushed to Docker Hub
            docker compose -f docker-compose.prod.yml pull

            # 3. Start or update containers in background (Zero Downtime)
            docker compose -f docker-compose.prod.yml up -d --remove-orphans

            # 4. Run database migrations inside the api container
            echo "Applying database schema migrations..."
            docker compose -f docker-compose.prod.yml exec -T api pnpm --filter=@repo/database db:migrate

            # 5. Clean old unused docker image layers to save disk space
            docker image prune -f

            echo "Containers deployed successfully! Listing running containers:"
            docker compose -f docker-compose.prod.yml ps
          EOF

